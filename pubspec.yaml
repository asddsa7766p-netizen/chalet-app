name: makan
description: شاليهات الأصدقاء - تطبيق حجز الشاليهات في فلسطين
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2

  # Backend
  supabase_flutter: ^2.3.0
  # عميل HTTP لـ Supabase يلتقط رفض تجديد الجلسة للحساب المحظور.
  http: ^1.6.0

  # Config
  flutter_dotenv: ^5.1.0
  sentry_flutter: ^8.14.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.1

  # UI
  cached_network_image: ^3.4.1
  table_calendar: ^3.0.9
  shimmer: ^3.0.0

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.1
  youtube_player_iframe: ^5.2.0

  # Utils
  intl: 0.20.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1

  image_picker: ^1.0.7
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  video_player_platform_interface: ^6.7.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/.env
    - assets/images/onboarding_bg.webp
    - assets/images/logo.png

# أيقونة التطبيق: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#575631"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  remove_alpha_ios: true
